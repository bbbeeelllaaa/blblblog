server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Keep normal API and avatar requests at 10 MiB plus multipart overhead.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # HTML: never cache (so browser always gets latest CSS/JS links)
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Uploads also work when this frontend is the public entry point.
    location ~ ^/api/upload/(image|video|file)$ {
        client_max_body_size 201m;
        client_body_timeout 600s;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Versioned assets (hashed filenames by Vite): cache forever
    location ~ \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Attachments must keep their forced-download API response.
    location ^~ /uploads/attachments/ {
        return 404;
    }

    # The deployment mounts the existing server uploads directory read-only.
    # Nginx static files support byte ranges for seeking MP4 and WebM videos.
    location ^~ /uploads/ {
        alias /app/uploads/;
        if ($uri ~ "(^|/)\.") { return 404; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400";
    }
}
