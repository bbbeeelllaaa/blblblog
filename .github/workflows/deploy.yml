name: Deploy to Server

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t blblblog-backend:latest ./backend

      - name: Build frontend image
        run: docker build -t blblblog-frontend:latest ./frontend

      - name: Save images to tarballs
        run: |
          docker save blblblog-backend:latest -o backend.tar
          docker save blblblog-frontend:latest -o frontend.tar
          sudo chmod 644 backend.tar frontend.tar
          ls -la backend.tar frontend.tar

      - name: Copy tarballs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "backend.tar,frontend.tar,deploy-backend.sh,deploy-frontend.sh,nginx/nginx.conf"
          target: /root/blblblog/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/blblblog
            bash deploy-backend.sh
            bash deploy-frontend.sh
            if docker inspect blblblog-nginx >/dev/null 2>&1; then
              docker exec blblblog-nginx nginx -t
              docker exec blblblog-nginx nginx -s reload
            fi
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused http://localhost/api/health
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused -o /dev/null http://localhost/
            echo "Deploy complete at $(date)"
